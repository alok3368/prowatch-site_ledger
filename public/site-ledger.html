<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>साइट लेजर — सिविल कॉन्ट्रैक्टर अकाउंटिंग</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAE6DC;
    --panel:#FFFFFF;
    --panel-2:#F5F1E8;
    --ink:#211E1A;
    --ink-soft:#6B655A;
    --line:#D3CCBB;
    --amber:#C1791F;
    --amber-dark:#96590F;
    --rust:#9C3B26;
    --rust-bg:#F3E3DD;
    --green:#35633A;
    --green-bg:#E2ECDF;
    --steel:#34506B;
    --steel-bg:#E4E9EE;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Hind',sans-serif;
    font-size:15px;
    line-height:1.45;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;
    background-attachment:fixed;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .rail{
    width:236px;
    flex-shrink:0;
    background:var(--ink);
    color:#EFEAE0;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:22px 20px 16px 20px;
    border-bottom:2px solid var(--amber);
  }
  .brand .mark{
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .brand .mark span{color:var(--amber);}
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AF9E;
    margin-top:4px;
    letter-spacing:0.5px;
  }
  nav{padding:14px 10px;flex:1;}
  nav button{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:right;
    background:none;
    border:none;
    color:#D8D2C4;
    font-family:'Hind',sans-serif;
    font-size:15.5px;
    font-weight:500;
    padding:11px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-bottom:2px;
    flex-direction:row-reverse;
    justify-content:flex-end;
  }
  nav button .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8D8676;
    margin-left:auto;
  }
  nav button:hover{background:#2E2A24;color:#fff;}
  nav button.active{background:var(--amber);color:#211E1A;font-weight:700;}
  nav button.active .num{color:#4A2E0A;}
  .rail-foot{
    padding:14px 20px 18px 20px;
    border-top:1px solid #35312A;
    font-size:11.5px;
    color:#8D8676;
    font-family:'IBM Plex Mono',monospace;
  }
  .lang-toggle{display:flex;gap:4px;padding:0 20px 14px 20px;}
  .lang-btn{
    flex:1;font-family:'Hind',sans-serif;font-weight:600;font-size:12px;
    padding:6px 0;border-radius:var(--radius);border:1px solid #4A4539;
    background:transparent;color:#B7AF9E;cursor:pointer;
  }
  .lang-btn.active{background:var(--amber);color:#211E1A;border-color:var(--amber);}

  /* ---------- Main ---------- */
  main{flex:1;padding:26px 32px 60px 32px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .page-head h1{font-size:24px;margin:0;font-weight:700;}
  .page-head p{margin:4px 0 0 0;color:var(--ink-soft);font-size:13.5px;}
  .btn{
    font-family:'Hind',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border-radius:var(--radius);
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:#EFEAE0;
    cursor:pointer;
  }
  .btn:hover{background:#3A352C;}
  .btn.amber{background:var(--amber);border-color:var(--amber-dark);color:#211E1A;}
  .btn.amber:hover{background:#B06E1C;}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn.danger{background:var(--rust-bg);color:var(--rust);border-color:var(--rust);}

  /* Insight banners */
  .insights{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .insight{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;border-radius:var(--radius);
    font-size:13.5px;border:1px solid;
  }
  .insight.warn{background:var(--rust-bg);border-color:#D8B6A9;color:var(--rust);}
  .insight.info{background:var(--steel-bg);border-color:#BFCBD8;color:var(--steel);}
  .insight.ok{background:var(--green-bg);border-color:#BFD1BC;color:var(--green);}
  .insight b{font-weight:700;}
  .insight .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:24px;}
  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .kpi .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
  .kpi.income .value{color:var(--green);}
  .kpi.expense .value{color:var(--rust);}
  .kpi.profit .value.pos{color:var(--green);}
  .kpi.profit .value.neg{color:var(--rust);}

  /* Panels/cards */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
  .panel h2{font-size:15.5px;margin:0 0 14px 0;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:right;font-size:11.5px;text-transform:none;color:var(--ink-soft);
    border-bottom:1.5px solid var(--ink);padding:7px 8px;font-weight:600;
  }
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:var(--panel-2);}
  td.num, th.num{font-family:'IBM Plex Mono',monospace;text-align:left;white-space:nowrap;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.paid{background:var(--green-bg);color:var(--green);}
  .tag.due{background:var(--rust-bg);color:var(--rust);}
  .tag.income{background:var(--green-bg);color:var(--green);}
  .tag.expense{background:var(--rust-bg);color:var(--rust);}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{
    background:none;border:1px solid var(--line);border-radius:var(--radius);
    cursor:pointer;font-size:12px;padding:3px 8px;color:var(--ink-soft);font-family:'Hind',sans-serif;
  }
  .row-actions button:hover{border-color:var(--ink);color:var(--ink);}

  /* Bars for category breakdown */
  .barrow{margin-bottom:11px;}
  .barrow .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .barrow .top .amt{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .bartrack{background:var(--panel-2);border-radius:20px;height:8px;overflow:hidden;}
  .barfill{height:100%;background:var(--amber);border-radius:20px;}

  /* Filters bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  select, input[type=text], input[type=date], input[type=number]{
    font-family:'Hind',sans-serif;font-size:13.5px;padding:7px 10px;
    border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  input.mono, select.mono{font-family:'IBM Plex Mono',monospace;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(33,30,26,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border-radius:var(--radius);width:100%;max-width:560px;
    max-height:90vh;overflow-y:auto;padding:22px 26px 26px 26px;border-top:4px solid var(--amber);
  }
  .modal h3{margin:0 0 16px 0;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{font-family:'Hind',sans-serif;font-size:13.5px;padding:7px 10px;border:1.5px solid var(--line);border-radius:var(--radius);resize:vertical;min-height:50px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:13px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-size:30px;margin-bottom:8px;}

  .party-list{display:flex;flex-direction:column;gap:0;}
  .party-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .party-item:hover{background:var(--panel-2);}
  .party-item .pname{font-weight:600;font-size:14px;}
  .party-item .ptype{font-size:11.5px;color:var(--ink-soft);}
  .party-item .pbal{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}

  .proj-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;
  }
  .proj-card .ptop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .proj-card h3{margin:0;font-size:16px;}
  .proj-card .client{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .proj-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
  .proj-stats .s{background:var(--panel-2);padding:8px 10px;border-radius:var(--radius);}
  .proj-stats .s .l{font-size:10.5px;color:var(--ink-soft);}
  .proj-stats .s .v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
  .status-pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
  .status-pill.चालू{background:var(--steel-bg);color:var(--steel);}
  .status-pill.पूर्ण{background:var(--green-bg);color:var(--green);}
  .status-pill.रुका{background:var(--rust-bg);color:var(--rust);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
</style>
</head>

async function checkAuth(){
  const res = await fetch('/api/me', {credentials:'include'});
  if(res.status===401){ return null; }
  return await res.json();
}

async function loadState(){
  try{
    const res = await fetch('/api/state', {credentials:'include'});
    if(res.status===204){
      // no shared data saved yet on the server -> seed it once
      state = seedData();
      await saveState();
      return;
    }
    if(!res.ok) throw new Error('load failed: '+res.status);
    state = await res.json();
  }catch(e){
    console.error('loadState failed, starting with seed data locally', e);
    state = seedData();
    return;
  }
  // migration: older saved data may not have custom categories yet
  let changed = false;
  if(!state.categories){ state.categories = {income:[...DEFAULT_CATS_INCOME], expense:[...DEFAULT_CATS_EXPENSE]}; changed = true; }
  if(!state.categories.income) { state.categories.income = [...DEFAULT_CATS_INCOME]; changed = true; }
  if(!state.categories.expense) { state.categories.expense = [...DEFAULT_CATS_EXPENSE]; changed = true; }
  // make sure any category already used in existing transactions is present in the list
  state.transactions.forEach(t=>{
    const key = t.type==='Income'?'income':'expense';
    if(t.category && !state.categories[key].includes(t.category)){ state.categories[key].push(t.category); changed = true; }
  });
  if(changed) await saveState();
}
async function saveState(){
  try{
    const res = await fetch('/api/state', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state),
    });
    if(!res.ok) throw new Error('save failed: '+res.status);
    const data = await res.json();
    if(data.meta) state._meta = data.meta;
  }catch(e){ console.error('save failed', e); alert(tr('saveError')); }
}

/* ---------------- derived calc helpers ---------------- */
function txTotal(t){ return (t.amount||0) + Math.round((t.amount||0)*(t.gst||0)/100); }
function gstAmt(t){ return Math.round((t.amount||0)*(t.gst||0)/100); }

function partyName(id){
  const p = state.parties.find(x=>x.id===id);
  return p ? p.name : '—';
}
function projectName(id){
  const p = state.projects.find(x=>x.id===id);
  return p ? p.name : '—';
}

function overallTotals(list){
  let income=0, expense=0, cash=0, outstandingReceivable=0, outstandingPayable=0, outputGst=0, inputGst=0;
  list.forEach(t=>{
    const tot = txTotal(t);
    if(t.type==='Income'){
      income += tot;
      outputGst += gstAmt(t);
      if(t.status==='बकाया') outstandingReceivable += tot;
      if(t.mode==='नकद' && t.status==='भुगतान हो गया') cash += tot;
    } else {
      expense += tot;
      inputGst += gstAmt(t);
      if(t.status==='बकाया') outstandingPayable += tot;
      if(t.mode==='नकद' && t.status==='भुगतान हो गया') cash -= tot;
    }
  });
  return {income,expense,profit:income-expense,cash,outstandingReceivable,outstandingPayable,netGst:outputGst-inputGst};
}

function projectStats(pid){
  const list = state.transactions.filter(t=>t.project===pid);
  const tt = overallTotals(list);
  const proj = state.projects.find(p=>p.id===pid);
  const margin = tt.income>0 ? (tt.profit/tt.income*100) : 0;
  return {...tt, margin, contractValue: proj?proj.contractValue:0};
}

  }
  return insights;
}

/* ---------------- Transactions ---------------- */
function filteredTx(){
  return state.transactions.filter(t=>{
    if(txFilters.project!=='all' && t.project!==txFilters.project) return false;
    if(txFilters.type!=='all' && t.type!==txFilters.type) return false;
    if(txFilters.status!=='all' && t.status!==txFilters.status) return false;
    if(txFilters.q){
      const q = txFilters.q.toLowerCase();
      const hay = (t.desc+' '+t.category+' '+partyName(t.party)+' '+(t.ref||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date));
}

/* ---------------- Reports ---------------- */
function renderReports(){
  const tt = overallTotals(state.transactions);
  // monthly trend last 6 months
  const months = [];
  const now = new Date(2026,8,3); // fixed "today" reference
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString(lang==='en'?'en-IN':'hi-IN',{month:'short',year:'2-digit'})});
  }
  const monthData = months.map(m=>{
    const inc = state.transactions.filter(t=>t.type==='Income' && t.date.startsWith(m.key)).reduce((s,t)=>s+txTotal(t),0);
    const exp = state.transactions.filter(t=>t.type==='Expense' && t.date.startsWith(m.key)).reduce((s,t)=>s+txTotal(t),0);
    return {...m, inc, exp};
  });
  const maxM = Math.max(1,...monthData.map(m=>Math.max(m.inc,m.exp)));

  // GST summary
  const outputGst = state.transactions.filter(t=>t.type==='Income').reduce((s,t)=>s+gstAmt(t),0);
  const inputGst = state.transactions.filter(t=>t.type==='Expense').reduce((s,t)=>s+gstAmt(t),0);

  return `
    <div class="page-head"><div><h1>${tr('reportsTitle')}</h1><p>${tr('reportsSub')}</p></div></div>

    <div class="grid-2">
      <div class="panel">
        <h2>${tr('monthlyTrend')}</h2>
        ${monthData.map(m=>`
          <div class="barrow">
            <div class="top"><span>${m.label}</span><span class="amt">${fmt(m.inc-m.exp)}</span></div>
            <div class="bartrack"><div class="barfill" style="width:${(m.inc/maxM*100).toFixed(0)}%;background:var(--green);"></div></div>
            <div class="bartrack" style="margin-top:3px;"><div class="barfill" style="width:${(m.exp/maxM*100).toFixed(0)}%;background:var(--rust);"></div></div>
          </div>
        `).join('')}
        <p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px;"><span style="color:var(--green);">■</span> ${tr('legendIncome')} &nbsp; <span style="color:var(--rust);">■</span> ${tr('legendExpense')}</p>
      </div>

      <div class="panel">
        <h2>${tr('gstSummary')}</h2>
        <div class="kpis" style="grid-template-columns:1fr;">
          <div class="kpi"><div class="label">${tr('outputGst')}</div><div class="value mono">${fmt(outputGst)}</div></div>
          <div class="kpi"><div class="label">${tr('inputGst')}</div><div class="value mono">${fmt(inputGst)}</div></div>
          <div class="kpi"><div class="label">${tr('netGstPayable')}</div><div class="value mono" style="color:${outputGst-inputGst>=0?'var(--rust)':'var(--green)'}">${fmt(outputGst-inputGst)}</div></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>${tr('projComparison')}</h2>
      <table>
        <thead><tr><th>${tr('thProject')}</th><th class="num">${tr('contractValue')}</th><th class="num">${tr('typeIncome')}</th><th class="num">${tr('typeExpense')}</th><th class="num">${tr('thProfit')}</th><th class="num">${tr('thMargin')}</th></tr></thead>
        <tbody>
        ${state.projects.map(p=>{
          const s = projectStats(p.id);
          return `<tr>
            <td>${p.name}</td>
            <td class="num">${fmt(p.contractValue)}</td>
            <td class="num" style="color:var(--green)">${fmt(s.income)}</td>
            <td class="num" style="color:var(--rust)">${fmt(s.expense)}</td>
            <td class="num" style="color:${s.profit>=0?'var(--green)':'var(--rust)'}">${fmt(s.profit)}</td>
            <td class="num">${s.income>0?s.margin.toFixed(1):'0'}%</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function catUsageCount(type, cat){
  return state.transactions.filter(t=>t.type===type && t.category===cat).length;
}

  const key = type==='Income'?'income':'expense';
  const list = state.categories[key];

    const usedLabel = lang==='en' ? `used in ${used} transaction${used===1?'':'s'}` : `${used} लेन-देन में उपयोग`;

async function addCategory(type, name){
  const key = type==='Income'?'income':'expense';
  name = (name||'').trim();
  if(!name) return;
  if(state.categories[key].some(c=>c.toLowerCase()===name.toLowerCase())){ alert(tr('catExists')); return; }
  state.categories[key].push(name);
  await saveState();
}

        <div class="field"><label>${tr('fieldAmount')}</label><input class="mono" type="number" name="amount" value="${t.amount}" required min="0" step="1"></div>
        <div class="field"><label>${tr('fieldGst')}</label>
          <select class="mono" name="gst">${GST_RATES.map(r=>`<option value="${r}" ${t.gst==r?'selected':''}>${r}%</option>`).join('')}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>${tr('fieldPayMode')}</label>
          <select name="mode">${PAY_MODES.map(m=>`<option value="${m}" ${t.mode===m?'selected':''}>${L(m)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>${tr('fieldStatus')}</label>
          <select name="status">
            <option value="भुगतान हो गया" ${t.status==='भुगतान हो गया'?'selected':''}>${L('भुगतान हो गया')}</option>
            <option value="बकाया" ${t.status==='बकाया'?'selected':''}>${L('बकाया')}</option>
          </select>
        </div>
      </div>
      <div class="field"><label>${tr('fieldRef')}</label><input type="text" name="ref" value="${t.ref||''}"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-action="close-modal">${tr('cancelBtn')}</button>
        <button type="submit" class="btn amber">${isEdit?tr('saveChangesBtn'):tr('addBtnModal')}</button>
      </div>
    </form>
  `);
  const catSelect = document.getElementById('tx-cat');
  function fillCats(selectValue){
    const type = document.getElementById('tx-type').value;
    const cats = state.categories[type==='Income'?'income':'expense'];
    const want = selectValue || t.category;
    catSelect.innerHTML = cats.map(c=>`<option value="${c}" ${want===c?'selected':''}>${L(c)}</option>`).join('');
    if(!cats.includes(want)) catSelect.selectedIndex = 0;
  }
  fillCats();
  document.getElementById('tx-type').addEventListener('change', ()=>fillCats());

  const addBtn = document.getElementById('tx-cat-add-btn');
  const addRow = document.getElementById('tx-cat-add-row');
  const addInput = document.getElementById('tx-cat-new-input');
  const addConfirm = document.getElementById('tx-cat-add-confirm');
  addBtn.addEventListener('click', ()=>{
    addRow.style.display = addRow.style.display==='none' ? 'block' : 'none';
    if(addRow.style.display==='block') addInput.focus();
  });
  async function confirmAddCat(){
    const type = document.getElementById('tx-type').value;
    const name = addInput.value.trim();
    if(!name) return;
    await addCategory(type, name);
    fillCats(name);
    addInput.value = '';
    addRow.style.display = 'none';
  }
  addConfirm.addEventListener('click', confirmAddCat);
  addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); confirmAddCat(); } });
  document.getElementById('tx-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const newTx = {
      id: t.id || uid('t'),
      date: fd.get('date'),
      project: fd.get('project'),
      type: fd.get('type'),
      category: fd.get('category'),
      party: fd.get('party') || null,
      desc: fd.get('desc'),
      amount: Number(fd.get('amount')),
      gst: Number(fd.get('gst')),
      mode: fd.get('mode'),
      status: fd.get('status'),
      ref: fd.get('ref'),
      createdBy: t.createdBy || (currentUser ? currentUser.email : null),
    };
    if(isEdit){
      const idx = state.transactions.findIndex(x=>x.id===t.id);
      state.transactions[idx] = newTx;
    } else {
      state.transactions.push(newTx);
    }
    await saveState();
    closeModal();
    render();
  });
}

/* ---------------- CSV export ---------------- */
function exportCsv(){
  const list = filteredTx();
  const headers = lang==='en'
    ? ['Date','Type','Project','Category','Description','Party','Amount','GST%','GST Amount','Total','Payment Mode','Status','Reference']
    : ['तारीख','प्रकार','प्रोजेक्ट','श्रेणी','विवरण','पार्टी','राशि','GST%','GST राशि','कुल','भुगतान माध्यम','स्थिति','रेफरेंस'];
  const rows = list.map(t=>[
    t.date, t.type==='Income'?tr('typeIncome'):tr('typeExpense'), projectName(t.project), L(t.category), (t.desc||'').replace(/,/g,';'),
    t.party?partyName(t.party):'', t.amount, t.gst, gstAmt(t), txTotal(t), L(t.mode), L(t.status), t.ref||''
  ]);
  const csv = [headers, ...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lena-dena-report.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- Event delegation ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>setTab(b.dataset.tab)));
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>setLang(b.dataset.lang)));

  const byAction = (action, fn) => {
    document.querySelectorAll(`[data-action="${action}"]`).forEach(el=>el.addEventListener('click', fn));
  };
  byAction('new-tx', (e)=> txModal(null, e.currentTarget.dataset.partyid));
  byAction('edit-tx', e=> txModal(state.transactions.find(t=>t.id===e.currentTarget.dataset.id)));
  byAction('del-tx', async e=>{
    if(confirm(tr('confirmDelTx'))){
      state.transactions = state.transactions.filter(t=>t.id!==e.currentTarget.dataset.id);
      await saveState(); render();
    }
  });
  byAction('new-proj', ()=>projModal(null));
  byAction('edit-proj', e=>projModal(state.projects.find(p=>p.id===e.currentTarget.dataset.id)));
  byAction('del-proj', async e=>{
    const id = e.currentTarget.dataset.id;
    const used = state.transactions.some(t=>t.project===id);
    if(used){ alert(tr('projInUse')); return; }
    if(confirm(tr('confirmDelProj'))){
      state.projects = state.projects.filter(p=>p.id!==id);
      await saveState(); render();
    }
  });
  byAction('new-party', ()=>partyModal(null));
  byAction('edit-party', e=>partyModal(state.parties.find(p=>p.id===e.currentTarget.dataset.id)));
  byAction('open-party', e=>{ activePartyId = e.currentTarget.dataset.id; render(); });
  byAction('back-parties', ()=>{ activePartyId=null; render(); });
  byAction('close-modal', closeModal);
  byAction('export-csv', exportCsv);

  const addCatIncome = document.getElementById('add-cat-income');
  if(addCatIncome) addCatIncome.addEventListener('submit', async e=>{
    e.preventDefault();
    const val = e.target.cat.value;
    await addCategory('Income', val);
    render();
  });
  const addCatExpense = document.getElementById('add-cat-expense');
  if(addCatExpense) addCatExpense.addEventListener('submit', async e=>{
    e.preventDefault();
    const val = e.target.cat.value;
    await addCategory('Expense', val);
    render();
  });
  byAction('del-cat', async e=>{
    const type = e.currentTarget.dataset.type;
    const cat = e.currentTarget.dataset.cat;
    if(catUsageCount(type,cat)>0) return;
    const confirmMsg = lang==='en' ? `Delete category "${L(cat)}"?` : `क्या "${L(cat)}" श्रेणी मिटाएं?`;
    if(confirm(confirmMsg)){
      const key = type==='Income'?'income':'expense';
      state.categories[key] = state.categories[key].filter(c=>c!==cat);
      await saveState(); render();
    }
  });

  const fp = document.getElementById('f-project'); if(fp) fp.addEventListener('change', e=>{txFilters.project=e.target.value; render();});
  const ft = document.getElementById('f-type'); if(ft) ft.addEventListener('change', e=>{txFilters.type=e.target.value; render();});
  const fs = document.getElementById('f-status'); if(fs) fs.addEventListener('change', e=>{txFilters.status=e.target.value; render();});
  const fq = document.getElementById('f-q'); if(fq) fq.addEventListener('input', e=>{txFilters.q=e.target.value; render(); document.getElementById('f-q').focus(); document.getElementById('f-q').selectionStart = document.getElementById('f-q').value.length;});
}

/* ---------------- Init ---------------- */
(async function init(){
  currentUser = await checkAuth();
  if(!currentUser){
    const renderLoginGate = () => {
      document.getElementById('app').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;">
          <div style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px 40px;text-align:center;max-width:360px;">
            <div class="lang-toggle" style="justify-content:center;margin-bottom:18px;">
              <button class="lang-btn ${lang==='hi'?'active':''}" data-lang="hi" style="color:${lang==='hi'?'#211E1A':'var(--ink-soft)'};border-color:var(--line);">हिंदी</button>
              <button class="lang-btn ${lang==='en'?'active':''}" data-lang="en" style="color:${lang==='en'?'#211E1A':'var(--ink-soft)'};border-color:var(--line);">English</button>
            </div>
            <div style="font-weight:700;font-size:22px;margin-bottom:4px;">साइट <span style="color:var(--amber);">लेजर</span></div>
            <div style="color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;">${tr('loginPrompt')}</div>
            <a href="/auth/google" class="btn amber" style="display:inline-block;text-decoration:none;">${tr('loginBtn')}</a>
            ${new URLSearchParams(location.search).get('login')==='denied' ? `<div style="color:var(--rust);font-size:12.5px;margin-top:14px;">${tr('loginDenied')}</div>` : ''}
          </div>
        </div>`;
      document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>{
        lang = b.dataset.lang; localStorage.setItem('siteledger_lang', lang); renderLoginGate();
      }));
    };
    renderLoginGate();
    return;
  }
  await loadState();
  render();
})();
</script>
