<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>साइट लेजर — सिविल कॉन्ट्रैक्टर अकाउंटिंग</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAE6DC;
    --panel:#FFFFFF;
    --panel-2:#F5F1E8;
    --ink:#211E1A;
    --ink-soft:#6B655A;
    --line:#D3CCBB;
    --amber:#C1791F;
    --amber-dark:#96590F;
    --rust:#9C3B26;
    --rust-bg:#F3E3DD;
    --green:#35633A;
    --green-bg:#E2ECDF;
    --steel:#34506B;
    --steel-bg:#E4E9EE;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Hind',sans-serif;
    font-size:15px;
    line-height:1.45;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;
    background-attachment:fixed;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .rail{
    width:236px;
    flex-shrink:0;
    background:var(--ink);
    color:#EFEAE0;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:22px 20px 16px 20px;
    border-bottom:2px solid var(--amber);
  }
  .brand .mark{
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .brand .mark span{color:var(--amber);}
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AF9E;
    margin-top:4px;
    letter-spacing:0.5px;
  }
  nav{padding:14px 10px;flex:1;}
  nav button{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:right;
    background:none;
    border:none;
    color:#D8D2C4;
    font-family:'Hind',sans-serif;
    font-size:15.5px;
    font-weight:500;
    padding:11px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-bottom:2px;
    flex-direction:row-reverse;
    justify-content:flex-end;
  }
  nav button .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8D8676;
    margin-left:auto;
  }
  nav button:hover{background:#2E2A24;color:#fff;}
  nav button.active{background:var(--amber);color:#211E1A;font-weight:700;}
  nav button.active .num{color:#4A2E0A;}
  .rail-foot{
    padding:14px 20px 18px 20px;
    border-top:1px solid #35312A;
    font-size:11.5px;
    color:#8D8676;
    font-family:'IBM Plex Mono',monospace;
  }
  .lang-toggle{display:flex;gap:4px;padding:0 20px 14px 20px;}
  .lang-btn{
    flex:1;font-family:'Hind',sans-serif;font-weight:600;font-size:12px;
    padding:6px 0;border-radius:var(--radius);border:1px solid #4A4539;
    background:transparent;color:#B7AF9E;cursor:pointer;
  }
  .lang-btn.active{background:var(--amber);color:#211E1A;border-color:var(--amber);}

  /* ---------- Main ---------- */
  main{flex:1;padding:26px 32px 60px 32px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .page-head h1{font-size:24px;margin:0;font-weight:700;}
  .page-head p{margin:4px 0 0 0;color:var(--ink-soft);font-size:13.5px;}
  .btn{
    font-family:'Hind',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border-radius:var(--radius);
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:#EFEAE0;
    cursor:pointer;
  }
  .btn:hover{background:#3A352C;}
  .btn.amber{background:var(--amber);border-color:var(--amber-dark);color:#211E1A;}
  .btn.amber:hover{background:#B06E1C;}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn.danger{background:var(--rust-bg);color:var(--rust);border-color:var(--rust);}

  /* Insight banners */
  .insights{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .insight{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;border-radius:var(--radius);
    font-size:13.5px;border:1px solid;
  }
  .insight.warn{background:var(--rust-bg);border-color:#D8B6A9;color:var(--rust);}
  .insight.info{background:var(--steel-bg);border-color:#BFCBD8;color:var(--steel);}
  .insight.ok{background:var(--green-bg);border-color:#BFD1BC;color:var(--green);}
  .insight b{font-weight:700;}
  .insight .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:24px;}
  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .kpi .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
  .kpi.income .value{color:var(--green);}
  .kpi.expense .value{color:var(--rust);}
  .kpi.profit .value.pos{color:var(--green);}
  .kpi.profit .value.neg{color:var(--rust);}

  /* Panels/cards */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
  .panel h2{font-size:15.5px;margin:0 0 14px 0;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:right;font-size:11.5px;text-transform:none;color:var(--ink-soft);
    border-bottom:1.5px solid var(--ink);padding:7px 8px;font-weight:600;
  }
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:var(--panel-2);}
  td.num, th.num{font-family:'IBM Plex Mono',monospace;text-align:left;white-space:nowrap;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.paid{background:var(--green-bg);color:var(--green);}
  .tag.due{background:var(--rust-bg);color:var(--rust);}
  .tag.income{background:var(--green-bg);color:var(--green);}
  .tag.expense{background:var(--rust-bg);color:var(--rust);}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{
    background:none;border:1px solid var(--line);border-radius:var(--radius);
    cursor:pointer;font-size:12px;padding:3px 8px;color:var(--ink-soft);font-family:'Hind',sans-serif;
  }
  .row-actions button:hover{border-color:var(--ink);color:var(--ink);}

  /* Bars for category breakdown */
  .barrow{margin-bottom:11px;}
  .barrow .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .barrow .top .amt{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .bartrack{background:var(--panel-2);border-radius:20px;height:8px;overflow:hidden;}
  .barfill{height:100%;background:var(--amber);border-radius:20px;}

  /* Filters bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  select, input[type=text], input[type=date], input[type=number]{
    font-family:'Hind',sans-serif;font-size:13.5px;padding:7px 10px;
    border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  input.mono, select.mono{font-family:'IBM Plex Mono',monospace;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(33,30,26,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border-radius:var(--radius);width:100%;max-width:560px;
    max-height:90vh;overflow-y:auto;padding:22px 26px 26px 26px;border-top:4px solid var(--amber);
  }
  .modal.wide{max-width:760px;}
  .modal h3{margin:0 0 16px 0;font-size:18px;}
  .items-head{display:grid;grid-template-columns:2.2fr 0.7fr 1fr 0.7fr 1fr 28px;gap:6px;font-size:11px;color:var(--ink-soft);font-weight:600;padding:0 2px 4px 2px;}
  .item-row{display:grid;grid-template-columns:2.2fr 0.7fr 1fr 0.7fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center;}
  .item-row input, .item-row select{width:100%;padding:6px 8px;font-size:13px;}
  .item-amt{font-size:13px;text-align:right;padding-right:4px;}
  .item-remove{background:none;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;color:var(--rust);font-size:12px;padding:5px 0;}
  .item-remove:hover{border-color:var(--rust);}
  .doc-total-row{display:flex;justify-content:flex-end;gap:8px;align-items:baseline;font-size:15px;font-weight:700;margin:12px 0 4px 0;border-top:1.5px solid var(--line);padding-top:10px;}
  .doc-total-row .mono{font-size:17px;}
  @media(max-width:640px){.items-head{display:none;} .item-row{grid-template-columns:1fr;background:var(--panel-2);padding:8px;border-radius:var(--radius);}}
  .ra-head{display:grid;grid-template-columns:2.4fr 0.8fr 0.8fr 0.9fr 0.8fr 1fr;gap:6px;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 2px 4px 2px;}
  .ra-row{display:grid;grid-template-columns:2.4fr 0.8fr 0.8fr 0.9fr 0.8fr 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
  .ra-desc{font-size:12.5px;} .ra-sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .ra-num{font-size:12.5px;text-align:right;}
  .ra-cumqty{width:100%;padding:5px 6px;font-size:12.5px;}
  .ra-summary{margin-top:14px;border-top:1.5px solid var(--line);padding-top:10px;font-size:13.5px;}
  .ra-summary>div{display:flex;justify-content:space-between;padding:4px 0;}
  .ra-summary .ra-net{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;}
  @media(max-width:640px){.ra-head{display:none;} .ra-row{grid-template-columns:1fr;background:var(--panel-2);padding:8px;border-radius:var(--radius);margin-bottom:6px;}}
  .mat-row{display:grid;grid-template-columns:2fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center;}
  .mat-row input{width:100%;padding:6px 8px;font-size:13px;}
  .forecast-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{font-family:'Hind',sans-serif;font-size:13.5px;padding:7px 10px;border:1.5px solid var(--line);border-radius:var(--radius);resize:vertical;min-height:50px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:13px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-size:30px;margin-bottom:8px;}

  .party-list{display:flex;flex-direction:column;gap:0;}
  .party-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .party-item:hover{background:var(--panel-2);}
  .party-item .pname{font-weight:600;font-size:14px;}
  .party-item .ptype{font-size:11.5px;color:var(--ink-soft);}
  .party-item .pbal{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}

  .proj-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;
  }
  .proj-card .ptop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .proj-card h3{margin:0;font-size:16px;}
  .proj-card .client{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .proj-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
  .proj-stats .s{background:var(--panel-2);padding:8px 10px;border-radius:var(--radius);}
  .proj-stats .s .l{font-size:10.5px;color:var(--ink-soft);}
  .proj-stats .s .v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
  .status-pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
  .status-pill.चालू{background:var(--steel-bg);color:var(--steel);}
  .status-pill.पूर्ण{background:var(--green-bg);color:var(--green);}
  .status-pill.रुका{background:var(--rust-bg);color:var(--rust);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
</style>
</head>

  const v = (T[lang] && T[lang][key]);
  if(v!==undefined) return v;
  return (T.hi[key]!==undefined) ? T.hi[key] : key;

// L() translates a *display* value drawn from a fixed set of Hindi data vocabulary

async function checkAuth(){

async function loadState(){
  try{
    const res = await fetch('/api/state', {credentials:'include'});
    if(res.status===204){
      // no shared data saved yet on the server -> seed it once
      state = seedData();
      await saveState();
      return;
    }
    if(!res.ok) throw new Error('load failed: '+res.status);
    state = await res.json();
  }catch(e){
    console.error('loadState failed, starting with seed data locally', e);
    state = seedData();
    return;
  }
  // migration: older saved data may not have custom categories yet
  let changed = false;
  if(!state.categories){ state.categories = {income:[...DEFAULT_CATS_INCOME], expense:[...DEFAULT_CATS_EXPENSE]}; changed = true; }
  if(!state.categories.income) { state.categories.income = [...DEFAULT_CATS_INCOME]; changed = true; }
  if(!state.categories.expense) { state.categories.expense = [...DEFAULT_CATS_EXPENSE]; changed = true; }
  // make sure any category already used in existing transactions is present in the list
  state.transactions.forEach(t=>{
    const key = t.type==='Income'?'income':'expense';
    if(t.category && !state.categories[key].includes(t.category)){ state.categories[key].push(t.category); changed = true; }
  });
  // migration: quotations & invoicing feature
  if(!state.quotations){ state.quotations = []; changed = true; }
  if(!state.invoices){ state.invoices = []; changed = true; }
  if(!state.counters){ state.counters = {quote:1, invoice:1, po:1}; changed = true; }
  if(state.counters && state.counters.po===undefined){ state.counters.po = 1; changed = true; }
  if(!state.purchaseOrders){ state.purchaseOrders = []; changed = true; }
  if(!state.raBills){ state.raBills = []; changed = true; }
  if(!state.retentions){ state.retentions = []; changed = true; }
  if(!state.labourers){ state.labourers = []; changed = true; }
  if(!state.attendance){ state.attendance = []; changed = true; }
  if(!state.materials){ state.materials = []; changed = true; }
  if(!state.stockEntries){ state.stockEntries = []; changed = true; }
  if(state.counters && state.counters.ra===undefined){ state.counters.ra = 1; changed = true; }
  state.projects.forEach(p=>{ if(!p.boq){ p.boq = []; changed = true; } });
  if(!state.businessProfile){ state.businessProfile = {name:'', address:'', gstin:'', phone:'', email:''}; changed = true; }
  if(changed) await saveState();
}
async function saveState(){
  try{
    const res = await fetch('/api/state', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state),
    });
    if(!res.ok) throw new Error('save failed: '+res.status);
    const data = await res.json();
    if(data.meta) state._meta = data.meta;
  }catch(e){ console.error('save failed', e); alert(tr('saveError')); }
}

/* ---------------- derived calc helpers ---------------- */
function txTotal(t){ return (t.amount||0) + Math.round((t.amount||0)*(t.gst||0)/100); }
function gstAmt(t){ return Math.round((t.amount||0)*(t.gst||0)/100); }

function partyName(id){
  const p = state.parties.find(x=>x.id===id);
  return p ? p.name : '—';
}
function projectName(id){
  const p = state.projects.find(x=>x.id===id);
  return p ? p.name : '—';
}

function overallTotals(list){
  let income=0, expense=0, cash=0, outstandingReceivable=0, outstandingPayable=0, outputGst=0, inputGst=0;
  list.forEach(t=>{
    const tot = txTotal(t);
    if(t.type==='Income'){
      income += tot;
      outputGst += gstAmt(t);
      if(t.status==='बकाया') outstandingReceivable += tot;
      if(t.mode==='नकद' && t.status==='भुगतान हो गया') cash += tot;
    } else {
      expense += tot;
      inputGst += gstAmt(t);
      if(t.status==='बकाया') outstandingPayable += tot;
      if(t.mode==='नकद' && t.status==='भुगतान हो गया') cash -= tot;
    }
  });
  return {income,expense,profit:income-expense,cash,outstandingReceivable,outstandingPayable,netGst:outputGst-inputGst};
}

function projectStats(pid){
  const list = state.transactions.filter(t=>t.project===pid);
  const tt = overallTotals(list);
  const proj = state.projects.find(p=>p.id===pid);
  const margin = tt.income>0 ? (tt.profit/tt.income*100) : 0;
  return {...tt, margin, contractValue: proj?proj.contractValue:0};
}

function buildInsights(tt){
  const insights = [];
  const overdueRecv = state.transactions.filter(t=>t.type==='Income' && t.status==='बकाया' && daysAgo(t.date)>30);
  const overduePay = state.transactions.filter(t=>t.type==='Expense' && t.status==='बकाया' && daysAgo(t.date)>30);
  if(overdueRecv.length){
    const sum = overdueRecv.reduce((s,t)=>s+txTotal(t),0);
    const html = lang==='en'
      ? `<b>${overdueRecv.length} client payment${overdueRecv.length===1?'':'s'}</b> have been due for over 30 days — total <b>${fmt(sum)}</b>. Follow-up needed.`
      : `<b>${overdueRecv.length} क्लाइंट भुगतान</b> 30 दिन से ज़्यादा समय से बकाया हैं — कुल <b>${fmt(sum)}</b>। फॉलो-अप जरूरी।`;
    insights.push({level:'warn', html});
  }
  if(overduePay.length){
    const sum = overduePay.reduce((s,t)=>s+txTotal(t),0);
    const html = lang==='en'
      ? `<b>${overduePay.length} vendor/subcontractor payment${overduePay.length===1?'':'s'}</b> have been due for 30+ days — total <b>${fmt(sum)}</b>. Late payment could disrupt supply.`
      : `<b>${overduePay.length} वेंडर/सबकॉन्ट्रैक्टर भुगतान</b> 30 दिन से बकाया हैं — कुल <b>${fmt(sum)}</b>। समय पर भुगतान न होने से सप्लाई रुक सकती है।`;
    insights.push({level:'warn', html});
  }
  if(tt.cash < 50000){
    const html = lang==='en'
      ? `Cash balance is low: <b>${fmt(tt.cash)}</b>. Arrange funds for the site's day-to-day expenses.`
      : `नकद बैलेंस कम है: <b>${fmt(tt.cash)}</b>। साइट के रोज़मर्रा खर्चों के लिए फंड की व्यवस्था करें।`;
    insights.push({level:'warn', html});
  }
  state.projects.filter(p=>p.status==='चालू').forEach(p=>{
    const s = projectStats(p.id);
    if(s.income>0 && s.margin < 8){
      const html = lang==='en'
        ? `<b>${p.name}</b>'s margin has dropped to <b>${s.margin.toFixed(1)}%</b> — review costs.`
        : `<b>${p.name}</b> का मार्जिन घटकर <b>${s.margin.toFixed(1)}%</b> रह गया है — लागत की समीक्षा करें।`;
      insights.push({level:'warn', html});
    }
  });
  if(tt.netGst > 0){
    const html = lang==='en'
      ? `Estimated net GST liability: <b>${fmt(tt.netGst)}</b> (output − input). Keep this in mind when filing returns.`
      : `अनुमानित नेट GST देनदारी: <b>${fmt(tt.netGst)}</b> (आउटपुट − इनपुट)। रिटर्न फाइल करते समय ध्यान रखें।`;
    insights.push({level:'info', html});
  }
  if(insights.length===0){
    const html = lang==='en'
      ? `All payments are on time and cash balance is healthy — great work!`
      : `सभी भुगतान समय पर हैं और नकद बैलेंस स्वस्थ है — बढ़िया काम!`;
    insights.push({level:'ok', html});
  }
  return insights;
}

function itemsTotal(items){
  return (items||[]).reduce((s,it)=>{ const base=(it.qty||0)*(it.rate||0); return s + base + Math.round(base*(it.gst||0)/100); },0);
}
function itemRowHtml(it){
  it = it || {desc:'', qty:1, rate:'', gst:0};
  return `<div class="item-row">
    <input type="text" class="item-desc" placeholder="${tr('itemDesc')}" value="${(it.desc||'').replace(/"/g,'&quot;')}">

    <input type="number" class="item-rate mono" min="0" step="1" value="${it.rate!==undefined?it.rate:''}">
    <select class="item-gst mono">${GST_RATES.map(r=>`<option value="${r}" ${Number(it.gst)===r?'selected':''}>${r}%</option>`).join('')}</select>
    <span class="item-amt mono">${fmt(0)}</span>
    <button type="button" class="item-remove" title="remove">✕</button>
  </div>`;
}
function wireItems(container, totalElId){
  function recalc(){
    let total = 0;
    container.querySelectorAll('.item-row').forEach(row=>{
      const qty = Number(row.querySelector('.item-qty').value)||0;
      const rate = Number(row.querySelector('.item-rate').value)||0;
      const gst = Number(row.querySelector('.item-gst').value)||0;
      const base = qty*rate;
      const amt = base + Math.round(base*gst/100);
      row.querySelector('.item-amt').textContent = fmt(amt);
      total += amt;
    });
    const totalEl = document.getElementById(totalElId);
    if(totalEl) totalEl.textContent = fmt(total);
  }
  container.addEventListener('input', recalc);
  container.addEventListener('change', recalc);
  container.addEventListener('click', e=>{
    if(e.target.classList.contains('item-remove')){
      if(container.querySelectorAll('.item-row').length>1){ e.target.closest('.item-row').remove(); recalc(); }
    }
  });
  recalc();
  return recalc;
}
function readItems(container){
  const items = [];
  container.querySelectorAll('.item-row').forEach(row=>{
    const desc = row.querySelector('.item-desc').value.trim();
    const qty = Number(row.querySelector('.item-qty').value)||0;
    const rate = Number(row.querySelector('.item-rate').value)||0;
    const gst = Number(row.querySelector('.item-gst').value)||0;
    if(!desc && qty===0 && rate===0) return;
    items.push({desc, qty, rate, gst});
  });
  return items;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function boqRowHtml(it){

    <input type="number" class="boq-qty mono" min="0" step="any" value="${it.qty!==undefined?it.qty:''}">
    <input type="number" class="boq-rate mono" min="0" step="any" value="${it.rate!==undefined?it.rate:''}">
    <span class="boq-amt mono">${fmt(0)}</span>
    <button type="button" class="item-remove" title="remove">✕</button>
  </div>`;
}
function wireBoq(container){
  function recalc(){
    let total = 0;
    container.querySelectorAll('.item-row').forEach(row=>{
      const qty = Number(row.querySelector('.boq-qty').value)||0;
      const rate = Number(row.querySelector('.boq-rate').value)||0;
      const amt = qty*rate;
      row.querySelector('.boq-amt').textContent = fmt(amt);
      total += amt;
    });
    const totalEl = document.getElementById('boq-total-el');
    if(totalEl) totalEl.textContent = fmt(total);
  }
  container.addEventListener('input', recalc);
  container.addEventListener('click', e=>{
    if(e.target.classList.contains('item-remove')){
      if(container.querySelectorAll('.item-row').length>1){ e.target.closest('.item-row').remove(); recalc(); }
    }
  });
  recalc();
  return recalc;
}
function readBoq(container){
  const items = [];
  container.querySelectorAll('.item-row').forEach(row=>{
    const desc = row.querySelector('.boq-desc').value.trim();
    const unit = row.querySelector('.boq-unit').value.trim();
    const qty = Number(row.querySelector('.boq-qty').value)||0;
    const rate = Number(row.querySelector('.boq-rate').value)||0;
    if(!desc && !unit && qty===0 && rate===0) return;
    items.push({id: row.dataset.id || uid('bq'), desc, unit, qty, rate});
  });
  return items;
}

/* ---------------- RA Bills (Running Account) ---------------- */
function getPreviousRABill(projectId, createdAt, excludeId){
  const bills = state.raBills.filter(b=>b.project===projectId && b.id!==excludeId && b.createdAt < createdAt);
  if(bills.length===0) return null;
  return bills.reduce((latest,b)=> b.createdAt>latest.createdAt?b:latest);
}
function prevCumQtyFromBill(prevBill, boqItemId){
  if(!prevBill) return 0;
  const m = (prevBill.measurements||[]).find(x=>x.boqItemId===boqItemId);
  return m ? (m.cumulativeQty||0) : 0;
}
function raBillCalc(bill){
  const prevBill = getPreviousRABill(bill.project, bill.createdAt, bill.id);
  const rows = (bill.measurements||[]).map(m=>{
    const prevQty = prevCumQtyFromBill(prevBill, m.boqItemId);
    const thisQty = (m.cumulativeQty||0) - prevQty;
    const thisAmt = thisQty * (m.rate||0);
    return {...m, prevQty, thisQty, thisAmt};
  });
  const basicValue = rows.reduce((s,r)=>s+r.thisAmt,0);
  const gstAmount = Math.round(basicValue * (bill.gstPct||0)/100);
  const grossValue = basicValue + gstAmount;
  const retentionAmount = Math.round(basicValue * (bill.retentionPct||0)/100);
  const otherDed = bill.otherDeductions||0;
  const netPayable = grossValue - retentionAmount - otherDed;
  return {rows, basicValue, gstAmount, grossValue, retentionAmount, otherDed, netPayable};
}
function markRABillPaidTx(bill){
  if(bill.linkedTransactionId) return;
  const calc = raBillCalc(bill);
  const project = state.projects.find(p=>p.id===bill.project);
  const txObj = {
    id: uid('t'), date: bill.billDate, project: bill.project, type:'Income', category: RA_INCOME_CATEGORY,
    party: null, desc: (lang==='en'?'RA Bill ':'RA बिल ') + bill.number + (project?(' — '+project.name):''),
    amount: calc.netPayable, gst:0, mode: PAY_MODES[1], status:'भुगतान हो गया', ref: bill.number,
    createdBy: currentUser ? currentUser.email : null,
  };
  state.transactions.push(txObj);
  bill.linkedTransactionId = txObj.id;
  if(calc.retentionAmount > 0 && !state.retentions.some(r=>r.raBillId===bill.id)){
    state.retentions.push({
      id: uid('ret'), project: bill.project, type: RETENTION_TYPES[0], raBillId: bill.id,
      amount: calc.retentionAmount, heldDate: bill.billDate, expectedReleaseDate: '',
      status: RETENTION_STATUS[0], releasedDate: null, linkedTransactionId: null, notes: '',
      createdBy: currentUser ? currentUser.email : null,
    });
  }
}

            <td class="row-actions">

              ${b.status!=='भुगतान हो गया'?`<button data-action="mark-paid-ra" data-id="${b.id}">${tr('markPaidBtn')}</button>`:''}
              <button data-action="edit-ra" data-id="${b.id}">${tr('editBtn')}</button>

function measurementRowHtml(m){
  return `<div class="ra-row" data-boq-id="${m.boqItemId}" data-desc="${escapeHtml(m.desc)}" data-unit="${escapeHtml(m.unit||'')}" data-rate="${m.rate}" data-contractqty="${m.contractQty}" data-prev="${m.prevQty}">

function readRAMeasurements(container){
  const out = [];
  container.querySelectorAll('.ra-row').forEach(row=>{
    out.push({
      boqItemId: row.dataset.boqId, desc: row.dataset.desc||'', unit: row.dataset.unit||'',
      rate: Number(row.dataset.rate)||0, contractQty: Number(row.dataset.contractqty)||0,
      cumulativeQty: Number(row.querySelector('.ra-cumqty').value)||0,
    });
  });
  return out;
}
function wireRAMeasurements(container, retentionInput, gstInput, otherDedInput, totalsEls){
  function recalc(){
    let basic = 0;
    container.querySelectorAll('.ra-row').forEach(row=>{
      const prev = Number(row.dataset.prev)||0;
      const rate = Number(row.dataset.rate)||0;
      const cum = Number(row.querySelector('.ra-cumqty').value)||0;
      const thisQty = cum - prev;
      const thisAmt = thisQty*rate;
      row.querySelector('.ra-thisqty').textContent = thisQty;
      row.querySelector('.ra-thisamt').textContent = fmt(thisAmt);
      basic += thisAmt;
    });
    const gstPct = Number(gstInput.value)||0;
    const retPct = Number(retentionInput.value)||0;
    const otherDed = Number(otherDedInput.value)||0;
    const gstAmt = Math.round(basic*gstPct/100);
    const gross = basic + gstAmt;
    const retAmt = Math.round(basic*retPct/100);
    const net = gross - retAmt - otherDed;
    totalsEls.basic.textContent = fmt(basic);
    totalsEls.gst.textContent = fmt(gstAmt);
    totalsEls.gross.textContent = fmt(gross);
    totalsEls.retention.textContent = fmt(retAmt);
    totalsEls.net.textContent = fmt(net);
  }
  container.addEventListener('input', recalc);
  retentionInput.addEventListener('input', recalc);
  gstInput.addEventListener('input', recalc);
  otherDedInput.addEventListener('input', recalc);
  recalc();
  return recalc;
}

/* ---------------- Labour Attendance & Wages ---------------- */
function computeWageSummary(dateFrom, dateTo, projectId){
  return state.labourers.map(l=>{
    const recs = state.attendance.filter(a=> a.labourerId===l.id && a.project===projectId && !a.settled && a.date>=dateFrom && a.date<=dateTo);
    const presentDays = recs.filter(a=>a.status==='उपस्थित').length;
    const halfDays = recs.filter(a=>a.status==='आधा दिन').length;
    const absentDays = recs.filter(a=>a.status==='अनुपस्थित').length;
    const wageEarned = presentDays*l.dailyWage + halfDays*l.dailyWage*0.5;
    const advanceGiven = recs.reduce((s,a)=>s+(a.advance||0),0);
    const netPayable = wageEarned - advanceGiven;
    return {labourerId:l.id, name:l.name, presentDays, halfDays, absentDays, wageEarned, advanceGiven, netPayable, recordIds: recs.map(a=>a.id)};
  }).filter(s=> s.presentDays+s.halfDays+s.absentDays>0 || s.advanceGiven>0);
}

/* ---------------- Material Stock Ledger ---------------- */
function computeStockOverview(projectId){
  return state.materials.map(m=>{
    const entries = state.stockEntries.filter(e=> e.materialId===m.id && (projectId==='all'||e.project===projectId));
    const totalIn = entries.filter(e=>e.type===STOCK_TYPES[0]).reduce((s,e)=>s+e.qty,0);
    const totalOut = entries.filter(e=>e.type===STOCK_TYPES[1]).reduce((s,e)=>s+e.qty,0);
    const adjustments = entries.filter(e=>e.type===STOCK_TYPES[2]).reduce((s,e)=>s+e.qty,0);
    const balance = totalIn - totalOut + adjustments;
    const purchaseEntries = entries.filter(e=>e.type===STOCK_TYPES[0] && e.qty>0);
    const totalPurchaseValue = purchaseEntries.reduce((s,e)=>s+e.qty*(e.rate||0),0);
    const totalPurchaseQty = purchaseEntries.reduce((s,e)=>s+e.qty,0);
    const avgRate = totalPurchaseQty>0 ? totalPurchaseValue/totalPurchaseQty : 0;
    return {material:m, totalIn, totalOut, adjustments, balance, avgRate, estValue: balance*avgRate};
  });
}

/* ---------------- Cash Flow Forecast ---------------- */
function getScheduledCashEvents(){
  const events = [];
  state.invoices.forEach(inv=>{
    if(inv.status==='बकाया'){
      const amt = itemsTotal(inv.items);
      if(amt>0) events.push({date: inv.dueDate||inv.date, amount:amt, direction:'in', label:(lang==='en'?'Invoice ':'इनवॉइस ')+inv.number});
    }
  });
  state.raBills.forEach(b=>{
    if(b.status!=='भुगतान हो गया'){
      const net = raBillCalc(b).netPayable;
      if(net>0) events.push({date: b.billDate, amount:net, direction:'in', label:(lang==='en'?'RA Bill ':'RA बिल ')+b.number});
    }
  });
  state.retentions.forEach(r=>{
    if(r.status==='रोका गया' && r.expectedReleaseDate){
      events.push({date: r.expectedReleaseDate, amount:r.amount, direction:'in', label:(lang==='en'?'Retention — ':'रिटेंशन — ')+projectName(r.project)});
    }
  });
  state.purchaseOrders.forEach(po=>{
    if(po.status!=='प्राप्त हुआ'){
      const amt = itemsTotal(po.items);
      if(amt>0) events.push({date: po.deliveryDate||po.date, amount:amt, direction:'out', label:(lang==='en'?'PO ':'पीओ ')+po.number});
    }
  });
  state.transactions.forEach(t=>{
    if(t.status==='बकाया'){
      const amt = txTotal(t);
      if(amt>0) events.push({date:t.date, amount:amt, direction: t.type==='Income'?'in':'out', label: t.desc || L(t.category)});
    }
  });
  return events;
}
function buildForecast(){
  const today = new Date(); today.setHours(0,0,0,0);
  const events = getScheduledCashEvents();
  const realizedNet = state.transactions.filter(t=>t.status==='भुगतान हो गया').reduce((s,t)=> s + (t.type==='Income'?txTotal(t):-txTotal(t)), 0);

  let overdueIn=0, overdueOut=0;
  const horizonDays = [30,60,90];
  const buckets = horizonDays.map(h=>({days:h, in:0, out:0}));
  const upcoming = [];

  events.forEach(ev=>{
    const d = new Date(ev.date);
    if(isNaN(d.getTime())) return;
    d.setHours(0,0,0,0);
    const diffDays = Math.round((d-today)/86400000);
    const isOverdue = diffDays<0;
    if(isOverdue){ if(ev.direction==='in') overdueIn+=ev.amount; else overdueOut+=ev.amount; }
    if(diffDays<=90){
      buckets.forEach(b=>{ if(diffDays<=b.days){ if(ev.direction==='in') b.in+=ev.amount; else b.out+=ev.amount; } });
      upcoming.push({...ev, diffDays, isOverdue});
    }
  });
  upcoming.sort((a,b)=>a.diffDays-b.diffDays);

  const results = buckets.map(b=>({
    days: b.days, in: b.in, out: b.out, net: b.in-b.out,
    projectedBalance: realizedNet + b.in - b.out,
  }));
  return {realizedNet, overdueIn, overdueOut, buckets: results, upcoming};
}

/* ---------------- GST Filing Summary ---------------- */
function computeGSTBreakup(dateFrom, dateTo){
  const outward = {}; const inward = {};
  GST_RATES.forEach(r=>{ outward[r] = {taxable:0, gst:0}; inward[r] = {taxable:0, gst:0}; });
  state.transactions.forEach(t=>{
    if(t.date<dateFrom || t.date>dateTo) return;
    const rate = GST_RATES.includes(Number(t.gst)) ? Number(t.gst) : 0;
    const taxable = t.amount || 0;
    const gst = gstAmt(t);
    if(t.type==='Income'){ outward[rate].taxable += taxable; outward[rate].gst += gst; }
    else { inward[rate].taxable += taxable; inward[rate].gst += gst; }
  });
  const outwardRows = GST_RATES.filter(r=>r>0).map(r=>({rate:r, taxable:outward[r].taxable, gst:outward[r].gst}));
  const inwardRows = GST_RATES.filter(r=>r>0).map(r=>({rate:r, taxable:inward[r].taxable, gst:inward[r].gst}));
  const totalOutwardTaxable = outwardRows.reduce((s,r)=>s+r.taxable,0);
  const totalOutwardGst = outwardRows.reduce((s,r)=>s+r.gst,0);
  const totalInwardTaxable = inwardRows.reduce((s,r)=>s+r.taxable,0);
  const totalInwardGst = inwardRows.reduce((s,r)=>s+r.gst,0);
  return {
    outwardRows, inwardRows, totalOutwardTaxable, totalOutwardGst, totalInwardTaxable, totalInwardGst,
    zeroRatedOutward: outward[0].taxable, zeroRatedInward: inward[0].taxable,
    netGstPayable: totalOutwardGst - totalInwardGst,
  };
}

/* ---------------- Cashbook ---------------- */
function computeCashbook(dateStr, projectId){
  let list = state.transactions.filter(t=>t.mode==='नकद' && t.status==='भुगतान हो गया');
  if(projectId && projectId!=='all') list = list.filter(t=>t.project===projectId);
  const before = list.filter(t=>t.date < dateStr);
  const openingBalance = before.reduce((s,t)=> s + (t.type==='Income'?txTotal(t):-txTotal(t)), 0);
  const dayList = list.filter(t=>t.date===dateStr).slice().sort((a,b)=> (a.id > b.id ? 1 : -1));
  let running = openingBalance;
  const rows = dayList.map(t=>{
    const amt = txTotal(t);
    running += (t.type==='Income' ? amt : -amt);
    return {...t, amt, running};
  });
  const cashIn = dayList.filter(t=>t.type==='Income').reduce((s,t)=>s+txTotal(t),0);
  const cashOut = dayList.filter(t=>t.type==='Expense').reduce((s,t)=>s+txTotal(t),0);
  return {openingBalance, rows, cashIn, cashOut, closingBalance: running};
}

/* ---------------- Reports ---------------- */
function buildReportData(){
  const tt = overallTotals(state.transactions);
  const months = [];
  const now = new Date(2026,8,3); // fixed "today" reference
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString(lang==='en'?'en-IN':'hi-IN',{month:'short',year:'2-digit'})});
  }
  const monthData = months.map(m=>{
    const inc = state.transactions.filter(t=>t.type==='Income' && t.date.startsWith(m.key)).reduce((s,t)=>s+txTotal(t),0);
    const exp = state.transactions.filter(t=>t.type==='Expense' && t.date.startsWith(m.key)).reduce((s,t)=>s+txTotal(t),0);
    return {...m, inc, exp};
  });
  const outputGst = state.transactions.filter(t=>t.type==='Income').reduce((s,t)=>s+gstAmt(t),0);
  const inputGst = state.transactions.filter(t=>t.type==='Expense').reduce((s,t)=>s+gstAmt(t),0);
  const projRows = state.projects.map(p=>({p, s: projectStats(p.id)}));
  return {tt, monthData, outputGst, inputGst, projRows};
}

  const {tt, monthData, outputGst, inputGst, projRows} = buildReportData();
  const maxM = Math.max(1,...monthData.map(m=>Math.max(m.inc,m.exp)));

            <div class="bartrack" style="margin-top:3px;"><div class="barfill" style="width:${(m.exp/maxM*100).toFixed(0)}%;background:var(--rust);"></div></div>

async function addCategory(type, name){
  const key = type==='Income'?'income':'expense';
  name = (name||'').trim();
  if(!name) return;
  if(state.categories[key].some(c=>c.toLowerCase()===name.toLowerCase())){ alert(tr('catExists')); return; }
  state.categories[key].push(name);
  await saveState();
}

/* ---------------- Modals ---------------- */
function openModal(html, wide){
  const div = document.createElement('div');
  div.className = 'overlay';
  div.id = 'modal-overlay';
  div.innerHTML = `<div class="modal${wide?' wide':''}">${html}</div>`;
  document.body.appendChild(div);
  div.addEventListener('click', e=>{ if(e.target===div) closeModal(); });
  div.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){
  const el = document.getElementById('modal-overlay');
  if(el) el.remove();
}

      createdBy: t.createdBy || (currentUser ? currentUser.email : null),
    };
    if(isEdit){
      const idx = state.transactions.findIndex(x=>x.id===t.id);
      state.transactions[idx] = newTx;
    } else {

    }

}

/* ---------------- CSV export ---------------- */
function exportCsv(){
  const list = filteredTx();
  const headers = lang==='en'
    ? ['Date','Type','Project','Category','Description','Party','Amount','GST%','GST Amount','Total','Payment Mode','Status','Reference']
    : ['तारीख','प्रकार','प्रोजेक्ट','श्रेणी','विवरण','पार्टी','राशि','GST%','GST राशि','कुल','भुगतान माध्यम','स्थिति','रेफरेंस'];
  const rows = list.map(t=>[
    t.date, t.type==='Income'?tr('typeIncome'):tr('typeExpense'), projectName(t.project), L(t.category), (t.desc||'').replace(/,/g,';'),
    t.party?partyName(t.party):'', t.amount, t.gst, gstAmt(t), txTotal(t), L(t.mode), L(t.status), t.ref||''
  ]);
  const csv = [headers, ...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lena-dena-report.csv';
  a.click();
  URL.revokeObjectURL(url);
}

          <div style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px 40px;text-align:center;max-width:360px;">

              <button class="lang-btn ${lang==='en'?'active':''}" data-lang="en" style="color:${lang==='en'?'#211E1A':'var(--ink-soft)'};border-color:var(--line);">English</button>

            <a href="/auth/google" class="btn amber" style="display:inline-block;text-decoration:none;">${tr('loginBtn')}</a>
            ${new URLSearchParams(location.search).get('login')==='denied' ? `<div style="color:var(--rust);font-size:12.5px;margin-top:14px;">${tr('loginDenied')}</div>` : ''}
          </div>
        </div>`;
      document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>{
        lang = b.dataset.lang; localStorage.setItem('siteledger_lang', lang); renderLoginGate();
      }));
    };
    renderLoginGate();
    return;
  }
  await loadState();
  render();
})();
